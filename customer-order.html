const CATEGORIES = ["Semua", ...new Set(MENU.map(m => m.category))];

// ============================================================
// STATE
// ============================================================
let cart        = {};     // { itemId: { ...menuItem, qty, notes } }
let activeCategory = "Semua";
let cartOpen    = false;
let checkoutStep = "menu"; // menu | checkout | success
let lastOrder   = null;

// ============================================================
// HELPERS
// ============================================================
function formatCurrency(n) {
  return "Rp " + Number(n).toLocaleString("id-ID");
}

function cartItemCount() {
  return Object.values(cart).reduce((s, i) => s + i.qty, 0);
}

function cartSubtotal() {
  return Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0);
}

function cartTotal() {
  return cartSubtotal() + SERVICE_FEE;
}

function getFilteredMenu() {
  if (activeCategory === "Semua") return MENU;
  return MENU.filter(m => m.category === activeCategory);
}

async function generateOrderId() {
  try {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const snap = await getDocs(query(
      collection(db, "orders"),
      where("createdAt", ">=", Timestamp.fromDate(today))
    ));
    const num = String(snap.size + 1).padStart(3, "0");
    return `${areaCode}-${num}`;
  } catch {
    const num = String(Math.floor(Math.random() * 900) + 100);
    return `${areaCode}-${num}`;
  }
}

// ============================================================
// CART LOGIC
// ============================================================
function addToCart(itemId) {
  const item = MENU.find(m => m.id === itemId);
  if (!item || !item.stock) return;
  if (cart[itemId]) {
    cart[itemId].qty++;
  } else {
    cart[itemId] = { ...item, qty: 1, notes: "" };
  }
  updateCartUI();
  showToast(`${item.name} ditambahkan`, "success");
}

function removeFromCart(itemId) {
  if (!cart[itemId]) return;
  if (cart[itemId].qty > 1) {
    cart[itemId].qty--;
  } else {
    delete cart[itemId];
  }
  updateCartUI();
}

function deleteFromCart(itemId) {
  delete cart[itemId];
  updateCartUI();
}

function setItemNotes(itemId, notes) {
  if (cart[itemId]) cart[itemId].notes = notes;
}

// ============================================================
// CHECKOUT
// ============================================================
async function submitOrder(customerName, customerWhatsapp, paymentMethod) {
  const btnSubmit = document.getElementById("btn-submit-order");
  if (btnSubmit) { btnSubmit.disabled = true; btnSubmit.textContent = "Memproses…"; }

  try {
    const orderId = await generateOrderId();
    const items = Object.values(cart).map(i => ({
      name: i.name, qty: i.qty, price: i.price, notes: i.notes
    }));
    const subtotal = cartSubtotal();
    const total    = cartTotal();
    const paymentStatus = paymentMethod === "QRIS" ? "PENDING" : "UNPAID";

    const orderData = {
      orderId,
      areaCode,
      customerName,
      customerWhatsapp,
      items,
      subtotal,
      serviceFee: SERVICE_FEE,
      total,
      paymentMethod,
      paymentStatus,
      orderStatus: "NEW",
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      readyAt: null,
      completedAt: null,
      whatsappSent: false,
    };

    await setDoc(doc(collection(db, "orders")), orderData);

    lastOrder = { ...orderData, orderId, total, customerName, paymentMethod, paymentStatus };
    cart = {};
    checkoutStep = "success";
    renderApp();
  } catch(e) {
    showToast("Gagal mengirim order. Coba lagi.", "error");
    if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.textContent = "Konfirmasi Pesanan"; }
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = "info") {
  const colors = { success: "#16a34a", error: "#dc2626", info: "#d97706" };
  const t = document.createElement("div");
  t.style.cssText = `
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:${colors[type]||colors.info};color:#fff;padding:10px 20px;
    border-radius:12px;font-size:13px;font-weight:500;z-index:9999;
    transition:all 0.3s;opacity:0;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.2);
    font-family:'DM Sans',sans-serif;
  `;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity = "1"; t.style.transform = "translateX(-50%) translateY(0)"; });
  setTimeout(() => {
    t.style.opacity = "0";
    t.style.transform = "translateX(-50%) translateY(20px)";
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderApp() {
  const root = document.getElementById("app-root");

  if (checkoutStep === "success") {
    root.innerHTML = renderSuccessPage();
    return;
  }
  if (checkoutStep === "checkout") {
    root.innerHTML = renderCheckoutPage();
    bindCheckoutEvents();
    return;
  }

  root.innerHTML = renderMenuPage();
  bindMenuEvents();
  updateCartUI();
}

  <div class="rounded-2xl overflow-hidden bg-white shadow-sm border border-earth-100 ${!item.stock?"opacity-60":""}">
    <div class="relative">
      <img src="${item.image}" alt="${item.name}" class="w-full h-32 object-cover" loading="lazy" />
      ${item.bestSeller ? `<span class="absolute top-2 left-2 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full">🔥 Best</span>` : ""}
      ${!item.stock ? `<div class="absolute inset-0 bg-white/60 flex items-center justify-center"><span class="bg-white text-earth-500 text-xs font-semibold px-3 py-1 rounded-full shadow">Habis</span></div>` : ""}
      <div class="absolute top-2 right-2 bg-white/80 backdrop-blur-sm text-earth-600 text-[10px] font-medium px-1.5 py-0.5 rounded-full">~${item.prepTime}m</div>
    </div>
    <div class="p-3">
      <div class="text-sm font-semibold text-earth-900 leading-tight mb-0.5 line-clamp-1">${item.name}</div>
      <div class="text-xs text-earth-400 mb-2 line-clamp-1">${item.description}</div>
      <div class="flex items-center justify-between">
        <div class="text-sm font-bold text-amber-700">${formatCurrency(item.price)}</div>
        ${item.stock ? (inCart
          ? `<div class="flex items-center gap-1.5">
              <button onclick="removeFromCart(${item.id})" class="w-6 h-6 rounded-lg bg-earth-100 text-earth-700 flex items-center justify-center font-bold text-base leading-none">−</button>
              <span class="font-mono font-bold text-earth-900 text-sm w-5 text-center">${inCart.qty}</span>
              <button onclick="addToCart(${item.id})" class="w-6 h-6 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold text-base leading-none">+</button>
            </div>`
          : `<button onclick="addToCart(${item.id})" class="btn-sm-primary px-3 py-1.5 rounded-xl text-xs font-semibold">+ Tambah</button>`
        ) : ""}
      </div>
    </div>
  </div>`;
}

function renderCartItems() {
  const items = Object.values(cart);
  if (items.length === 0) return "";
  return items.map(i => `
    <div class="flex gap-3 items-start">
      <img src="${i.image}" class="w-14 h-14 rounded-xl object-cover flex-shrink-0" />
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-earth-900 line-clamp-1">${i.name}</div>
        <div class="text-xs font-bold text-amber-700 mt-0.5">${formatCurrency(i.price)}</div>
        <input type="text" placeholder="Catatan (opsional)…" value="${i.notes}"
          oninput="setItemNotes(${i.id}, this.value)"
          class="mt-1.5 w-full text-xs border border-earth-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-400 bg-earth-50" />
        <div class="flex items-center gap-2 mt-2">
          <button onclick="removeFromCart(${i.id}); updateCartUI();" class="w-7 h-7 rounded-lg bg-earth-100 text-earth-700 flex items-center justify-center font-bold">−</button>
          <span class="font-mono font-bold text-earth-900 w-5 text-center">${i.qty}</span>
          <button onclick="addToCart(${i.id}); updateCartUI();" class="w-7 h-7 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold">+</button>
          <button onclick="deleteFromCart(${i.id}); updateCartUI();" class="ml-auto text-xs text-red-400 hover:text-red-600">Hapus</button>
        </div>
      </div>
    </div>
  `).join("");
}

// ============================================================
// UI UPDATE
// ============================================================
function updateCartUI() {
  const count = cartItemCount();
  const total = cartTotal();

  // FAB
  const fab = document.getElementById("cart-fab");
  if (fab) {
    if (count === 0) { fab.classList.add("translate-y-24","opacity-0"); fab.classList.remove("translate-y-0","opacity-100"); }
    else             { fab.classList.remove("translate-y-24","opacity-0"); fab.classList.add("translate-y-0","opacity-100"); }
  }
  const qtyEl = document.getElementById("cart-qty");
  if (qtyEl) qtyEl.textContent = count;
  const totEl = document.getElementById("cart-total-fab");
  if (totEl) totEl.textContent = formatCurrency(total);

  // Re-render menu cards (for +/- buttons)
  const grid = document.getElementById("menu-grid");
  if (grid) grid.innerHTML = getFilteredMenu().map(item => renderMenuCard(item)).join("");

  // Cart drawer items
  const list = document.getElementById("cart-items-list");
  if (list) {
    list.innerHTML = renderCartItems();
    if (count === 0) closeCart();
  }
}

function openCart()  { cartOpen = true;  document.getElementById("cart-drawer")?.classList.remove("translate-y-full"); document.getElementById("cart-drawer")?.classList.add("translate-y-0"); document.getElementById("cart-backdrop")?.classList.remove("opacity-0","pointer-events-none"); document.getElementById("cart-backdrop")?.classList.add("opacity-100"); }
function closeCart() { cartOpen = false; document.getElementById("cart-drawer")?.classList.add("translate-y-full"); document.getElementById("cart-drawer")?.classList.remove("translate-y-0"); document.getElementById("cart-backdrop")?.classList.add("opacity-0","pointer-events-none"); document.getElementById("cart-backdrop")?.classList.remove("opacity-100"); }
function goToCheckout() { if (cartItemCount()===0) return; checkoutStep = "checkout"; renderApp(); }
function backToMenu()   { checkoutStep = "menu"; renderApp(); }
function resetApp()     { checkoutStep = "menu"; lastOrder = null; cart = {}; renderApp(); }
function setCategory(c) { activeCategory = c; document.getElementById("menu-grid").innerHTML = getFilteredMenu().map(item => renderMenuCard(item)).join(""); document.querySelectorAll(".tab-btn").forEach(b => { b.classList.toggle("tab-active", b.dataset.cat === c); b.classList.toggle("tab-inactive", b.dataset.cat !== c); }); }

// ============================================================
// BIND EVENTS (only needed for checkout page)
// ============================================================
function bindMenuEvents() {}
function bindCheckoutEvents() {
  window.handleSubmitOrder = async function() {
    const name = document.getElementById("inp-name")?.value.trim();
    const wa   = document.getElementById("inp-wa")?.value.trim();
    const pm   = document.querySelector("input[name='payment']:checked")?.value || "QRIS";
    if (!name) { showToast("Nama harus diisi", "error"); return; }
    if (!wa || wa.length < 8) { showToast("WhatsApp harus diisi dengan benar", "error"); return; }
    await submitOrder(name, wa, pm);
  };
}

// ============================================================
// INIT
// ============================================================
window.addToCart      = addToCart;
window.removeFromCart = removeFromCart;
window.deleteFromCart = deleteFromCart;
window.setItemNotes   = setItemNotes;
window.openCart       = openCart;
window.closeCart      = closeCart;
window.goToCheckout   = goToCheckout;
window.backToMenu     = backToMenu;
window.resetApp       = resetApp;
window.setCategory    = setCategory;

document.addEventListener("DOMContentLoaded", () => {
  renderApp();
});
</script>

<style>
  :root {
    --font-display: 'Playfair Display', serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
    --cream: #f7f2e8;
    --earth-50: #faf7f0;
    --earth-100: #ede8db;
    --earth-200: #ddd4c2;
    --earth-400: #9c8e78;
    --earth-500: #7a6e5c;
    --earth-700: #4a4035;
    --earth-800: #3a3028;
    --earth-900: #2a221c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--earth-800);
    -webkit-tap-highlight-color: transparent;
  }
  .font-display { font-family: var(--font-display); }
  .font-mono    { font-family: var(--font-mono); }
  .bg-cream     { background-color: var(--cream); }

  .card-warm {
    background: #fff;
    border: 1px solid var(--earth-100);
    box-shadow: 0 2px 12px rgba(80,60,40,0.06);
  }

  .input-field {
    width: 100%;
    border: 1.5px solid var(--earth-200);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: var(--font-body);
    background: var(--earth-50);
    color: var(--earth-900);
    outline: none;
    transition: border-color 0.15s;
  }
  .input-field:focus { border-color: #d97706; }

  .btn-primary {
    background: linear-gradient(135deg, #b45309, #d97706);
    color: #fff;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-primary:active { transform: scale(0.97); }

  .btn-sm-primary {
    background: #d97706;
    color: #fff;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .tab-btn {
    font-family: var(--font-body);
    border: 1.5px solid transparent;
    background: #fff;
    color: var(--earth-500);
    cursor: pointer;
  }
  .tab-active {
    background: #d97706 !important;
    color: #fff !important;
    border-color: #b45309 !important;
  }

  .line-clamp-1 {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .safe-bottom {
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }

  ::-webkit-scrollbar { height: 3px; width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--earth-200); border-radius: 2px; }
</style>
</head>
<body>
  <div id="app-root"></div>
</body>
