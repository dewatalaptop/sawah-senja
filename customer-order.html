const firebaseConfig = {
  apiKey: "AIzaSyBPwP08GotnhWJ7A2d3VH09az5NSiMUPBo",

  projectId: "sawah-senja",
  storageBucket: "sawah-senja.firebasestorage.app",
  messagingSenderId: "568071270673",
  appId: "1:568071270673:web:15d54aeb8c01a81b491cb0"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const areaCode = (new URLSearchParams(window.location.search).get("table") || "GENERAL").toUpperCase();

// ============================================================
// MENU FALLBACK
// ============================================================
const MENU_FALLBACK = [
  { id:1,  category:"Sate",     name:"Sate Taichan",             price:18000, image:"https://dummyimage.com/600x400/c4793a/fff&text=Taichan",      description:"Sate ayam bakar bumbu taichan pedas segar",            stock:true,  bestSeller:true,  prepTime:10 },
  { id:2,  category:"Sate",     name:"Sate Maranggi",            price:18000, image:"https://dummyimage.com/600x400/b85c2a/fff&text=Maranggi",     description:"Sate sapi khas Purwakarta bumbu kecap manis",          stock:true,  bestSeller:true,  prepTime:10 },
  { id:3,  category:"Sate",     name:"Sate Madura",              price:18000, image:"https://dummyimage.com/600x400/a04820/fff&text=Madura",       description:"Sate ayam bumbu kacang khas Madura",                  stock:true,  bestSeller:false, prepTime:10 },
  { id:4,  category:"Sate",     name:"Mix Platter Saus Tartar",  price:18000, image:"https://dummyimage.com/600x400/8a3c18/fff&text=Mix+Platter",  description:"Mix sate pilihan dengan saus tartar spesial",         stock:true,  bestSeller:true,  prepTime:12 },
  { id:5,  category:"Gorengan", name:"Gorengan Saus Asam Pedas", price:12000, image:"https://dummyimage.com/600x400/c8903a/fff&text=Asam+Pedas",  description:"Gorengan crispy saus asam pedas segar",               stock:true,  bestSeller:false, prepTime:8  },
  { id:6,  category:"Gorengan", name:"Gorengan Saus Kacang",     price:12000, image:"https://dummyimage.com/600x400/b07030/fff&text=Kacang",      description:"Gorengan crispy saus kacang gurih",                   stock:true,  bestSeller:false, prepTime:8  },
  { id:7,  category:"Minuman",  name:"Kopi Susu SS",             price:10000, image:"https://dummyimage.com/600x400/3d2010/fff&text=Kopi+Susu",   description:"Kopi susu signature Sawah Senja",                     stock:true,  bestSeller:true,  prepTime:5  },
  { id:8,  category:"Minuman",  name:"Kopi SS",                  price:10000, image:"https://dummyimage.com/600x400/2a1508/fff&text=Kopi+SS",     description:"Kopi hitam signature Sawah Senja",                    stock:true,  bestSeller:false, prepTime:4  },
  { id:9,  category:"Minuman",  name:"Teh",                      price:6000,  image:"https://dummyimage.com/600x400/3a7060/fff&text=Teh",         description:"Teh hangat atau dingin",                              stock:true,  bestSeller:false, prepTime:3  },
  { id:10, category:"Minuman",  name:"Jeruk",                    price:8000,  image:"https://dummyimage.com/600x400/c87010/fff&text=Jeruk",       description:"Jeruk peras segar hangat atau dingin",                stock:true,  bestSeller:false, prepTime:4  },
];

let MENU       = [...MENU_FALLBACK];
let CATEGORIES = buildCats();
const SERVICE_FEE = 2000;

function buildCats() { return ["Semua", ...new Set(MENU.map(m => m.category))]; }

// STATE
let cart = {}, activeCategory = "Semua", cartOpen = false;
let checkoutStep = "menu", lastOrder = null;

// ============================================================
// FIRESTORE MENU LISTENER
// ============================================================
function startMenuListener() {
  try {
    onSnapshot(
      query(collection(db,"menu"), orderBy("category"), orderBy("name")),
      snap => {
        MENU = snap.empty ? [...MENU_FALLBACK] : snap.docs.map(d => ({
          id: d.id, ...d.data(),
          price: Number(d.data().price)||0,
          stock: d.data().stock !== false,
          bestSeller: d.data().bestSeller === true,
          prepTime: Number(d.data().prepTime)||0,
        }));
        CATEGORIES = buildCats();
        if (!CATEGORIES.includes(activeCategory)) activeCategory = "Semua";
        if (checkoutStep === "menu") {
          refreshMenuGrid();
          rebuildCategoryTabs();
          rebuildFeatured();
          updateCartUI();
        }
      }, () => { MENU = [...MENU_FALLBACK]; CATEGORIES = buildCats(); }
    );
  } catch { MENU = [...MENU_FALLBACK]; CATEGORIES = buildCats(); }
}

function refreshMenuGrid() {
  const g = document.getElementById("menu-grid");
  if (g) g.innerHTML = getFiltered().map(renderCard).join("");
}

function rebuildCategoryTabs() {
  const w = document.getElementById("cat-tabs");
  if (!w) return;
  w.innerHTML = CATEGORIES.map(c => `
    <button onclick="setCategory('${c}')" data-cat="${c}" class="cat-pill ${c===activeCategory?"cat-pill--active":""}">${c}</button>
  `).join("");
}

function rebuildFeatured() {
  const w = document.getElementById("featured-row");
  if (!w) return;
  const bs = MENU.filter(m => m.bestSeller && m.stock).slice(0,3);
  const sec = document.getElementById("featured-section");
  if (!bs.length) { if(sec) sec.style.display="none"; return; }
  if(sec) sec.style.display="";
  w.innerHTML = bs.map(item => `
    <div class="featured-card" onclick="addToCart('${item.id}')">
      <div class="featured-card__img" style="background:url('${item.image||""}') center/cover no-repeat,#2a1a0a"></div>
      <div class="featured-card__body">
        <span class="hot-badge">🔥 Favorit</span>
        <div class="featured-card__name">${item.name}</div>
        <div class="featured-card__price">${fmt(item.price)}</div>
      </div>
    </div>`).join("");
}

// ============================================================
// HELPERS
// ============================================================
const fmt = n => "Rp\u00a0" + Number(n).toLocaleString("id-ID");
const cartCount = () => Object.values(cart).reduce((s,i)=>s+i.qty,0);
const cartSub   = () => Object.values(cart).reduce((s,i)=>s+i.price*i.qty,0);
const cartTot   = () => cartSub() + SERVICE_FEE;
const getFiltered = () => activeCategory==="Semua" ? MENU : MENU.filter(m=>m.category===activeCategory);

// ============================================================
// ORDER ID
// ============================================================
async function generateOrderId() {
  try {
    const today = new Date(); today.setHours(0,0,0,0);
    const snap = await getDocs(query(collection(db,"orders"), where("createdAt",">=",Timestamp.fromDate(today))));
    return `${areaCode}-${String(snap.size+1).padStart(3,"0")}`;
  } catch { return `${areaCode}-${String(Math.floor(Math.random()*900)+100)}`; }
}

// ============================================================
// CART
// ============================================================
function addToCart(itemId) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  const item = MENU.find(m=>m.id==id);
  if (!item||!item.stock) return;
  cart[id] ? cart[id].qty++ : (cart[id]={...item,qty:1,notes:""});
  updateCartUI();
  showToast(`${item.name} ditambahkan ✓`, "success");
  pulseCartBtn();
}

function removeFromCart(itemId) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  if (!cart[id]) return;
  cart[id].qty > 1 ? cart[id].qty-- : delete cart[id];
  updateCartUI();
}

function deleteFromCart(itemId) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  delete cart[id];
  updateCartUI();
}

function setItemNotes(itemId, notes) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  if (cart[id]) cart[id].notes = notes;
}

function pulseCartBtn() {
  const btn = document.getElementById("cart-fab-btn");
  if (!btn) return;
  btn.classList.add("cart-pulse");
  setTimeout(()=>btn.classList.remove("cart-pulse"),400);
}

// ============================================================
// SUBMIT ORDER
// ============================================================
async function submitOrder(customerName, customerWhatsapp, paymentMethod) {
  const btn = document.getElementById("btn-submit-order");
  if (btn) { btn.disabled=true; btn.innerHTML=`<span class="spinner"></span> Memproses…`; }
  try {
    const orderId = await generateOrderId();
    const items   = Object.values(cart).map(i=>({name:i.name,qty:i.qty,price:i.price,notes:i.notes||""}));
    const subtotal = cartSub(), total = cartTot();
    const paymentStatus = paymentMethod==="QRIS" ? "PENDING" : "UNPAID";
    const orderData = {
      orderId, areaCode, customerName, customerWhatsapp,
      items, subtotal, serviceFee:SERVICE_FEE, total,
      paymentMethod, paymentStatus, orderStatus:"NEW",
      createdAt:serverTimestamp(), updatedAt:serverTimestamp(),
      readyAt:null, completedAt:null, whatsappSent:false,
    };
    const newRef = doc(collection(db,"orders"));
    await setDoc(newRef, orderData);
    lastOrder = {...orderData, orderId, total, customerName, areaCode, paymentMethod, paymentStatus};
    cart = {};
    checkoutStep = "success";
    renderApp();
  } catch(e) {
    console.error(e);
    showToast(`Gagal: ${e.code||e.message}`, "error");
    if (btn) { btn.disabled=false; btn.textContent="Konfirmasi Pesanan"; }
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type="info") {
  document.querySelectorAll(".ss-toast").forEach(t=>t.remove());
  const colors = {success:"#16a34a",error:"#dc2626",info:"#b45309"};
  const t = document.createElement("div");
  t.className = "ss-toast";
  t.style.cssText=`position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-16px);
    background:${colors[type]||colors.info};color:#fff;padding:12px 22px;border-radius:100px;
    font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:all 0.25s cubic-bezier(.34,1.56,.64,1);
    white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,0.4);pointer-events:none;
    font-family:'Cabinet Grotesk',sans-serif;letter-spacing:0.01em;`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>{t.style.opacity="1";t.style.transform="translateX(-50%) translateY(0)";});
  setTimeout(()=>{t.style.opacity="0";t.style.transform="translateX(-50%) translateY(-12px)";setTimeout(()=>t.remove(),250);},2000);
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderApp() {
  const root = document.getElementById("app-root");
  if (!root) return;
  if (checkoutStep==="success")  { root.innerHTML=renderSuccessPage(); return; }
  if (checkoutStep==="checkout") { root.innerHTML=renderCheckoutPage(); bindCheckoutEvents(); return; }
  root.innerHTML = renderMenuPage();
  updateCartUI();
}

// ============================================================
// MENU CARD
// ============================================================
function renderCard(item) {
  const id = item.id;
  const inCart = cart[id];
  const qty = inCart ? inCart.qty : 0;
  return `
  <div class="menu-card ${!item.stock?"menu-card--out":""}">
    <div class="menu-card__img-wrap">
      <img src="${item.image||""}" alt="${item.name}" class="menu-card__img" loading="lazy" onerror="this.style.background='#2a1a0a'"/>
      ${item.bestSeller?`<span class="menu-card__hot">🔥</span>`:""}
      ${!item.stock?`<div class="menu-card__sold-out">Habis</div>`:""}
      ${item.prepTime?`<span class="menu-card__time">~${item.prepTime}m</span>`:""}
    </div>
    <div class="menu-card__body">
      <div class="menu-card__name">${item.name}</div>
      <div class="menu-card__desc">${item.description||""}</div>
      <div class="menu-card__foot">
        <span class="menu-card__price">${fmt(item.price)}</span>
        ${item.stock ? (qty > 0
          ? `<div class="qty-ctrl">
              <button onclick="removeFromCart('${id}')" class="qty-btn qty-btn--minus">−</button>
              <span class="qty-num">${qty}</span>
              <button onclick="addToCart('${id}')" class="qty-btn qty-btn--plus">+</button>
            </div>`
          : `<button onclick="addToCart('${id}')" class="add-btn">+</button>`
        ) : ""}
      </div>
    </div>
  </div>`;
}

// ============================================================
// CART HTML
// ============================================================
function renderCartItems() {
  const items = Object.values(cart);
  if (!items.length) return "";
  return items.map(i=>`
    <div class="ci">
      <img src="${i.image||""}" class="ci__img" onerror="this.style.background='#2a1a0a'"/>
      <div class="ci__body">
        <div class="ci__name">${i.name}</div>
        <div class="ci__price">${fmt(i.price)}</div>
        <input type="text" placeholder="Catatan (opsional)…" value="${i.notes||""}"
          oninput="setItemNotes('${i.id}',this.value)" class="ci__note"/>
        <div class="ci__ctrl">
          <button onclick="removeFromCart('${i.id}')" class="qty-btn qty-btn--minus">−</button>
          <span class="qty-num">${i.qty}</span>
          <button onclick="addToCart('${i.id}')" class="qty-btn qty-btn--plus">+</button>
          <button onclick="deleteFromCart('${i.id}')" class="ci__del">Hapus</button>
        </div>
      </div>
    </div>`).join("");
}

function renderCartFooter() {
  const count = cartCount();
  if (!count) return `<div class="cart-empty"><div class="cart-empty__icon">🌾</div><div>Keranjang kosong</div></div>`;
  return `
    <div class="cart-totals">
      <div class="cart-total-row"><span>Subtotal</span><span>${fmt(cartSub())}</span></div>
      <div class="cart-total-row"><span>Service fee</span><span>${fmt(SERVICE_FEE)}</span></div>
      <div class="cart-total-row cart-total-row--grand"><span>Total</span><span>${fmt(cartTot())}</span></div>
    </div>
    <button onclick="goToCheckout()" class="cta-btn cta-btn--full">Lanjut Checkout</button>`;
}

// ============================================================
// UPDATE CART UI
// ============================================================
function updateCartUI() {
  const count = cartCount();
  const fab = document.getElementById("cart-fab");
  if (fab) { count===0 ? fab.classList.add("cart-fab--hidden") : fab.classList.remove("cart-fab--hidden"); }
  const qEl = document.getElementById("cart-qty");
  if (qEl) qEl.textContent = count;
  const tEl = document.getElementById("cart-total-fab");
  if (tEl) tEl.textContent = fmt(cartTot());
  refreshMenuGrid();
  const list = document.getElementById("cart-items-list");
  if (list) list.innerHTML = renderCartItems();
  const foot = document.getElementById("cart-footer");
  if (foot) foot.innerHTML = renderCartFooter();
  if (!count) closeCart();
}

// ============================================================
// CART OPEN / CLOSE
// ============================================================
function openCart() {
  cartOpen = true;
  document.getElementById("cart-drawer")?.classList.remove("cart-drawer--hidden");
  document.getElementById("cart-backdrop")?.classList.add("backdrop--visible");
}
function closeCart() {
  cartOpen = false;
  document.getElementById("cart-drawer")?.classList.add("cart-drawer--hidden");
  document.getElementById("cart-backdrop")?.classList.remove("backdrop--visible");
}
function goToCheckout() {
  if (!cartCount()) return;
  closeCart(); checkoutStep="checkout"; renderApp();
}
function backToMenu()  { checkoutStep="menu"; renderApp(); }
function resetApp()    { checkoutStep="menu"; lastOrder=null; cart={}; renderApp(); }
function setCategory(c) {
  activeCategory = c;
  refreshMenuGrid();
  document.querySelectorAll(".cat-pill").forEach(b=>b.classList.toggle("cat-pill--active",b.dataset.cat===c));
}

// ============================================================
// CHECKOUT EVENTS
// ============================================================
function bindCheckoutEvents() {
  window.handleSubmitOrder = async () => {
    const name = document.getElementById("inp-name")?.value.trim();
    const wa   = document.getElementById("inp-wa")?.value.trim();
    const pm   = document.querySelector("input[name='payment']:checked")?.value||"QRIS";
    if (!name)           { showToast("Nama harus diisi","error"); return; }
    if (!wa||wa.length<8){ showToast("Nomor WhatsApp tidak valid","error"); return; }
    await submitOrder(name,wa,pm);
  };
}

// GLOBALS
window.addToCart=addToCart; window.removeFromCart=removeFromCart;
window.deleteFromCart=deleteFromCart; window.setItemNotes=setItemNotes;
window.openCart=openCart; window.closeCart=closeCart;
window.goToCheckout=goToCheckout; window.backToMenu=backToMenu;
window.resetApp=resetApp; window.setCategory=setCategory;

document.addEventListener("DOMContentLoaded",()=>{ startMenuListener(); renderApp(); });
</script>
