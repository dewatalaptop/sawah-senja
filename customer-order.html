// ============================================================
// FIREBASE CONFIG
// ============================================================

let MENU       = [...MENU_FALLBACK];
let CATEGORIES = buildCategories();
const SERVICE_FEE = 2000;

function buildCategories() {
  return ["Semua", ...new Set(MENU.map(m => m.category))];
}

// ============================================================
// STATE
// ============================================================
let cart           = {};
let activeCategory = "Semua";
let cartOpen       = false;
let checkoutStep   = "menu"; // menu | checkout | success
let lastOrder      = null;

// ============================================================
// MENU LISTENER — Firestore "menu" collection, fallback ke dummy
// ============================================================
function startMenuListener() {
  try {
    onSnapshot(
      query(collection(db, "menu"), orderBy("category"), orderBy("name")),
      snap => {
        MENU = snap.empty
          ? [...MENU_FALLBACK]
          : snap.docs.map(d => ({
              id: d.id,
              ...d.data(),
              price:      Number(d.data().price)    || 0,
              stock:      d.data().stock             !== false,
              bestSeller: d.data().bestSeller        === true,
              prepTime:   Number(d.data().prepTime)  || 0,
            }));

        CATEGORIES = buildCategories();
        if (!CATEGORIES.includes(activeCategory)) activeCategory = "Semua";

        if (checkoutStep === "menu") {
          const grid = document.getElementById("menu-grid");
          if (grid) grid.innerHTML = getFilteredMenu().map(renderMenuCard).join("");
          rebuildCategoryTabs();
          rebuildBestSeller();
          updateCartUI();
        }
      },
      () => {
        MENU = [...MENU_FALLBACK];
        CATEGORIES = buildCategories();
      }
    );
  } catch(e) {
    MENU = [...MENU_FALLBACK];
    CATEGORIES = buildCategories();
  }
}

function rebuildCategoryTabs() {
  const wrap = document.getElementById("category-tabs");
  if (!wrap) return;
  wrap.innerHTML = CATEGORIES.map(c => `
    <button onclick="setCategory('${c}')" data-cat="${c}"
      class="snap-start flex-shrink-0 tab-btn ${c === activeCategory ? "tab-active" : ""} px-4 py-2 rounded-full text-sm font-medium transition-all">
      ${c}
    </button>`).join("");
}

function rebuildBestSeller() {
  const wrap = document.getElementById("best-seller-row");
  if (!wrap) return;
  const bs = MENU.filter(m => m.bestSeller && m.stock).slice(0, 3);
  const section = document.getElementById("best-seller-section");
  if (bs.length === 0) { if (section) section.style.display = "none"; return; }
  if (section) section.style.display = "";
  wrap.innerHTML = bs.map(item => `
    <div class="snap-start flex-shrink-0 w-48 rounded-2xl overflow-hidden bg-white shadow-md border border-earth-100">
      <img src="${item.image||""}" alt="${item.name}" class="w-full h-28 object-cover" loading="lazy" onerror="this.style.background='#ede8db'" />
      <div class="p-3">
        <div class="text-xs font-bold text-amber-700 mb-0.5">🔥 Best Seller</div>
        <div class="text-sm font-semibold text-earth-900 leading-tight mb-1">${item.name}</div>
        <div class="text-xs font-bold text-amber-700">${fmt(item.price)}</div>
        <button onclick="addToCart('${item.id}')" class="mt-2 w-full btn-sm-primary rounded-xl py-1.5 text-xs font-semibold">+ Tambah</button>
      </div>
    </div>`).join("");
}

// ============================================================
// HELPERS
// ============================================================
const fmt = n => "Rp " + Number(n).toLocaleString("id-ID");

function cartItemCount() { return Object.values(cart).reduce((s, i) => s + i.qty, 0); }
function cartSubtotal()  { return Object.values(cart).reduce((s, i) => s + i.price * i.qty, 0); }
function cartTotal()     { return cartSubtotal() + SERVICE_FEE; }

function getFilteredMenu() {
  return activeCategory === "Semua" ? MENU : MENU.filter(m => m.category === activeCategory);
}

// ============================================================
// ORDER ID — collision-safe
// ============================================================
async function generateOrderId() {
  try {
    const today = new Date(); today.setHours(0,0,0,0);
    const snap  = await getDocs(query(
      collection(db, "orders"),
      where("createdAt", ">=", Timestamp.fromDate(today))
    ));
    return `${areaCode}-${String(snap.size + 1).padStart(3, "0")}`;
  } catch {
    return `${areaCode}-${String(Math.floor(Math.random() * 900) + 100)}`;
  }
}

// ============================================================
// CART LOGIC
// ============================================================
function addToCart(itemId) {
  const id   = isNaN(itemId) ? itemId : Number(itemId);
  const item = MENU.find(m => m.id == id);
  if (!item || !item.stock) return;
  cart[id] ? cart[id].qty++ : (cart[id] = { ...item, qty: 1, notes: "" });
  updateCartUI();
  showToast(`${item.name} ditambahkan`, "success");
}

function removeFromCart(itemId) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  if (!cart[id]) return;
  cart[id].qty > 1 ? cart[id].qty-- : delete cart[id];
  updateCartUI();
}

function deleteFromCart(itemId) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  delete cart[id];
  updateCartUI();
}

function setItemNotes(itemId, notes) {
  const id = isNaN(itemId) ? itemId : Number(itemId);
  if (cart[id]) cart[id].notes = notes;
}

// ============================================================
// CHECKOUT — submit order ke Firestore
// ============================================================
async function submitOrder(customerName, customerWhatsapp, paymentMethod) {
  const btn = document.getElementById("btn-submit-order");
  if (btn) { btn.disabled = true; btn.textContent = "Memproses…"; }

  try {
    const orderId       = await generateOrderId();
    const items         = Object.values(cart).map(i => ({ name: i.name, qty: i.qty, price: i.price, notes: i.notes || "" }));
    const subtotal      = cartSubtotal();
    const total         = cartTotal();
    const paymentStatus = paymentMethod === "QRIS" ? "PENDING" : "UNPAID";

    const orderData = {
      orderId, areaCode, customerName, customerWhatsapp,
      items, subtotal, serviceFee: SERVICE_FEE, total,
      paymentMethod, paymentStatus,
      orderStatus: "NEW",
      createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      readyAt: null, completedAt: null, whatsappSent: false,
    };

    await setDoc(doc(collection(db, "orders")), orderData);

    lastOrder    = { ...orderData, orderId, total, customerName, areaCode, paymentMethod, paymentStatus };
    cart         = {};
    checkoutStep = "success";
    renderApp();
  } catch(e) {
    console.error(e);
    showToast("Gagal mengirim order. Coba lagi.", "error");
    if (btn) { btn.disabled = false; btn.textContent = "Konfirmasi Pesanan"; }
  }
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = "info") {
  const colors = { success:"#15803d", error:"#dc2626", info:"#b45309" };
  const t = document.createElement("div");
  t.style.cssText = `
    position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:${colors[type]||colors.info};color:#fff;padding:10px 20px;border-radius:12px;
    font-size:13px;font-weight:500;z-index:9999;transition:all 0.3s;opacity:0;
    white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.2);
    font-family:'DM Sans',sans-serif;pointer-events:none;`;
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.opacity="1"; t.style.transform="translateX(-50%) translateY(0)"; });
  setTimeout(() => {
    t.style.opacity="0"; t.style.transform="translateX(-50%) translateY(20px)";
    setTimeout(() => t.remove(), 300);
  }, 2200);
}

// ============================================================
// RENDER ENGINE
// ============================================================
function renderApp() {
  const root = document.getElementById("app-root");
  if (!root) return;
  if (checkoutStep === "success")  { root.innerHTML = renderSuccessPage();  return; }
  if (checkoutStep === "checkout") { root.innerHTML = renderCheckoutPage(); bindCheckoutEvents(); return; }
  root.innerHTML = renderMenuPage();
  updateCartUI();
}

        <!-- Area badge -->
        <div class="inline-flex items-center gap-2 bg-white/15 backdrop-blur-sm rounded-full px-3 py-1.5 mb-4 border border-white/20">
          <svg class="w-3 h-3 text-amber-200" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
          <span class="text-xs text-amber-100 font-medium">Area</span>
          <span class="font-mono font-bold text-white text-sm">${areaCode}</span>
        </div>

        <div class="font-display text-4xl font-bold leading-tight mb-1">Selamat<br/>Datang 🌾</div>
        <div class="text-amber-100/80 text-sm mt-1">Pilih menu favoritmu dan nikmati senja</div>
      </div>
    </div>

    <!-- ===== PROMO BANNER ===== -->
    <div class="mx-4 -mt-7 relative z-10">
      <div class="bg-gradient-to-r from-emerald-700 to-teal-600 rounded-2xl px-4 py-3 flex items-center gap-3 shadow-lg shadow-emerald-900/20">
        <div class="text-2xl">🎁</div>
        <div class="flex-1">
          <div class="text-white font-semibold text-sm">Promo Sore Ini!</div>
          <div class="text-emerald-100 text-xs">Gratis Es Teh untuk setiap Paket Senja</div>
        </div>
        <div class="text-emerald-200 text-xs font-mono bg-emerald-800/40 px-2 py-1 rounded-lg">Today</div>
      </div>
    </div>

    <div class="pb-40 pt-5">

      <!-- ===== BEST SELLER ===== -->
      <div id="best-seller-section" class="${recommended.length===0?"hidden":""}">
        <div class="px-4 mb-3 flex items-center gap-2">
          <div class="h-px flex-1 bg-earth-100"></div>
          <span class="font-display font-bold text-earth-700 text-sm">⭐ Best Seller</span>
          <div class="h-px flex-1 bg-earth-100"></div>
        </div>
        <div id="best-seller-row" class="flex gap-3 overflow-x-auto pb-2 px-4 snap-x scroll-smooth">
          ${recommended.map(item => `
          <div class="snap-start flex-shrink-0 w-48 rounded-2xl overflow-hidden bg-white shadow-md border border-earth-100">
            <img src="${item.image||""}" alt="${item.name}" class="w-full h-28 object-cover" loading="lazy" onerror="this.style.background='#ede8db'" />
            <div class="p-3">
              <div class="text-[10px] font-bold text-amber-700 mb-0.5">🔥 Best Seller</div>
              <div class="text-sm font-semibold text-earth-900 leading-tight mb-1">${item.name}</div>
              <div class="text-xs font-bold text-amber-700">${fmt(item.price)}</div>
              <button onclick="addToCart('${item.id}')" class="mt-2 w-full btn-sm-primary rounded-xl py-1.5 text-xs font-semibold">+ Tambah</button>
            </div>
          </div>`).join("")}
        </div>
      </div>

      <!-- ===== CATEGORY TABS ===== -->
      <div class="px-4 mt-4">
        <div id="category-tabs" class="flex gap-2 overflow-x-auto pb-1 -mx-4 px-4 snap-x">
          ${CATEGORIES.map(c => `
          <button onclick="setCategory('${c}')" data-cat="${c}"
            class="snap-start flex-shrink-0 tab-btn ${c===activeCategory?"tab-active":""} px-4 py-2 rounded-full text-sm font-medium transition-all">
            ${c}
          </button>`).join("")}
        </div>
      </div>

      <!-- ===== MENU GRID ===== -->
      <div id="menu-grid" class="px-4 mt-4 grid grid-cols-2 gap-3">
        ${getFilteredMenu().map(renderMenuCard).join("")}
      </div>

      <!-- Footer brand -->
      <div class="px-4 mt-10 mb-4 text-center">
        <div class="text-earth-300 text-xs">Sawah Senja · Makan enak di pinggir sawah 🌾</div>
      </div>
    </div>

    <!-- ===== CART FAB ===== -->
    <div id="cart-fab" class="fixed bottom-6 left-4 right-4 z-30 transition-all duration-300 ${cartItemCount()===0?"translate-y-24 opacity-0 pointer-events-none":"translate-y-0 opacity-100"}">
      <button onclick="openCart()" class="w-full btn-primary py-4 rounded-2xl font-semibold text-base flex items-center justify-between px-5 shadow-2xl shadow-amber-900/30">
        <div class="flex items-center gap-2.5">
          <div class="bg-white/20 rounded-lg w-7 h-7 flex items-center justify-center">
            <span class="text-sm font-bold" id="cart-qty">${cartItemCount()}</span>
          </div>
          <span>Lihat Keranjang</span>
        </div>
        <span id="cart-total-fab" class="font-mono font-bold">${fmt(cartTotal())}</span>
      </button>
    </div>

    <!-- ===== BACKDROP ===== -->
    <div id="cart-backdrop" onclick="closeCart()" class="fixed inset-0 bg-black/40 z-40 transition-opacity duration-300 opacity-0 pointer-events-none"></div>

    <!-- ===== CART DRAWER ===== -->
    <div id="cart-drawer" class="fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-3xl shadow-2xl transition-transform duration-300 translate-y-full" style="max-height:85vh;overflow-y:auto;">
      <div class="sticky top-0 bg-white px-5 pt-4 pb-3 border-b border-earth-100 z-10">
        <div class="w-10 h-1 bg-earth-200 rounded-full mx-auto mb-3"></div>
        <div class="flex items-center justify-between">
          <div>
            <div class="font-display font-bold text-earth-900 text-lg leading-none">Keranjang</div>
            <div class="text-earth-400 text-xs">Sawah Senja</div>
          </div>
          <button onclick="closeCart()" class="text-earth-400 text-2xl leading-none w-8 h-8 flex items-center justify-center">×</button>
        </div>
      </div>
      <div id="cart-items-list" class="px-5 py-4 space-y-3"></div>
      <div id="cart-footer" class="px-5 pb-6 pt-2 border-t border-earth-100"></div>
    </div>

  </div>`;
}

// ============================================================
// MENU CARD
// ============================================================
function renderMenuCard(item) {
  const id     = item.id;
  const inCart = cart[id];
  return `
  <div class="rounded-2xl overflow-hidden bg-white shadow-sm border border-earth-100 transition-all ${!item.stock?"opacity-60":"hover:shadow-md"}">
    <div class="relative">
      <img src="${item.image||""}" alt="${item.name}" class="w-full h-32 object-cover" loading="lazy" onerror="this.style.background='#ede8db'" />
      ${item.bestSeller ? `<span class="absolute top-2 left-2 bg-amber-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow">🔥 Best</span>` : ""}
      ${!item.stock ? `<div class="absolute inset-0 bg-white/60 flex items-center justify-center"><span class="bg-white text-earth-500 text-xs font-semibold px-3 py-1 rounded-full shadow">Habis</span></div>` : ""}
      ${item.prepTime ? `<div class="absolute top-2 right-2 bg-black/30 backdrop-blur-sm text-white text-[10px] font-medium px-1.5 py-0.5 rounded-full">~${item.prepTime}m</div>` : ""}
    </div>
    <div class="p-3">
      <div class="text-sm font-semibold text-earth-900 leading-tight mb-0.5 line-clamp-1">${item.name}</div>
      <div class="text-xs text-earth-400 mb-2 line-clamp-1">${item.description||""}</div>
      <div class="flex items-center justify-between">
        <div class="text-sm font-bold text-amber-700">${fmt(item.price)}</div>
        ${item.stock ? (inCart
          ? `<div class="flex items-center gap-1.5">
              <button onclick="removeFromCart('${id}')" class="w-6 h-6 rounded-lg bg-earth-100 text-earth-700 flex items-center justify-center font-bold text-base leading-none active:scale-90 transition-transform">−</button>
              <span class="font-mono font-bold text-earth-900 text-sm w-5 text-center">${inCart.qty}</span>
              <button onclick="addToCart('${id}')" class="w-6 h-6 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold text-base leading-none active:scale-90 transition-transform">+</button>
            </div>`
          : `<button onclick="addToCart('${id}')" class="btn-sm-primary px-3 py-1.5 rounded-xl text-xs font-semibold active:scale-95 transition-transform">+ Tambah</button>`
        ) : ""}
      </div>
    </div>
  </div>`;
}

// ============================================================
// CART ITEMS HTML
// ============================================================
function renderCartItemsHTML() {
  const items = Object.values(cart);
  if (items.length === 0) return "";
  return items.map(i => `
    <div class="flex gap-3 items-start">
      <img src="${i.image||""}" class="w-14 h-14 rounded-xl object-cover flex-shrink-0 bg-earth-100" onerror="this.style.background='#ede8db'" />
      <div class="flex-1 min-w-0">
        <div class="text-sm font-semibold text-earth-900 line-clamp-1">${i.name}</div>
        <div class="text-xs font-bold text-amber-700 mt-0.5">${fmt(i.price)}</div>
        <input type="text" placeholder="Catatan (opsional)…" value="${i.notes||""}"
          oninput="setItemNotes('${i.id}', this.value)"
          class="mt-1.5 w-full text-xs border border-earth-200 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-amber-400 bg-earth-50" />
        <div class="flex items-center gap-2 mt-2">
          <button onclick="removeFromCart('${i.id}')" class="w-7 h-7 rounded-lg bg-earth-100 text-earth-700 flex items-center justify-center font-bold active:scale-90 transition-transform">−</button>
          <span class="font-mono font-bold text-earth-900 w-5 text-center">${i.qty}</span>
          <button onclick="addToCart('${i.id}')" class="w-7 h-7 rounded-lg bg-amber-500 text-white flex items-center justify-center font-bold active:scale-90 transition-transform">+</button>
          <button onclick="deleteFromCart('${i.id}')" class="ml-auto text-xs text-red-400 hover:text-red-600 transition-colors">Hapus</button>
        </div>
      </div>
    </div>`).join("");
}

function renderCartFooterHTML() {
  const count = cartItemCount();
  if (count === 0) {
    return `<div class="py-8 text-center"><div class="text-4xl mb-2">🌾</div><div class="text-earth-500 text-sm">Keranjang masih kosong</div></div>`;
  }
  return `
    <div class="space-y-1.5 mb-4">
      <div class="flex justify-between text-sm text-earth-500"><span>Subtotal</span><span>${fmt(cartSubtotal())}</span></div>
      <div class="flex justify-between text-sm text-earth-500"><span>Service fee</span><span>${fmt(SERVICE_FEE)}</span></div>
      <div class="flex justify-between font-bold text-earth-900 text-base pt-1 border-t border-earth-100"><span>Total</span><span>${fmt(cartTotal())}</span></div>
    </div>
    <button onclick="goToCheckout()" class="btn-primary w-full py-4 rounded-2xl font-semibold text-base">
      Lanjut Checkout
    </button>`;
}

// ============================================================
// UPDATE CART UI
// ============================================================
function updateCartUI() {
  const count = cartItemCount();

  const fab = document.getElementById("cart-fab");
  if (fab) {
    if (count === 0) { fab.classList.add("translate-y-24","opacity-0","pointer-events-none"); fab.classList.remove("translate-y-0","opacity-100"); }
    else             { fab.classList.remove("translate-y-24","opacity-0","pointer-events-none"); fab.classList.add("translate-y-0","opacity-100"); }
  }
  const qtyEl = document.getElementById("cart-qty");
  if (qtyEl) qtyEl.textContent = count;
  const totEl = document.getElementById("cart-total-fab");
  if (totEl) totEl.textContent = fmt(cartTotal());

  const grid = document.getElementById("menu-grid");
  if (grid) grid.innerHTML = getFilteredMenu().map(renderMenuCard).join("");

  const listEl = document.getElementById("cart-items-list");
  if (listEl) listEl.innerHTML = renderCartItemsHTML();

  const footEl = document.getElementById("cart-footer");
  if (footEl) footEl.innerHTML = renderCartFooterHTML();

  if (count === 0) closeCart();
}

// ============================================================
// CART OPEN / CLOSE
// ============================================================
function openCart() {
  cartOpen = true;
  document.getElementById("cart-drawer")?.classList.replace("translate-y-full","translate-y-0");
  const bd = document.getElementById("cart-backdrop");
  bd?.classList.remove("opacity-0","pointer-events-none");
  bd?.classList.add("opacity-100");
}

function closeCart() {
  cartOpen = false;
  document.getElementById("cart-drawer")?.classList.replace("translate-y-0","translate-y-full");
  const bd = document.getElementById("cart-backdrop");
  bd?.classList.add("opacity-0","pointer-events-none");
  bd?.classList.remove("opacity-100");
}

function goToCheckout() {
  if (cartItemCount() === 0) return;
  closeCart();
  checkoutStep = "checkout";
  renderApp();
}

function backToMenu()  { checkoutStep = "menu";  renderApp(); }
function resetApp()    { checkoutStep = "menu"; lastOrder = null; cart = {}; renderApp(); }

function setCategory(c) {
  activeCategory = c;
  const grid = document.getElementById("menu-grid");
  if (grid) grid.innerHTML = getFilteredMenu().map(renderMenuCard).join("");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("tab-active", b.dataset.cat === c));
}

// ============================================================
// CHECKOUT EVENTS
// ============================================================
function bindCheckoutEvents() {
  window.handleSubmitOrder = async () => {
    const name = document.getElementById("inp-name")?.value.trim();
    const wa   = document.getElementById("inp-wa")?.value.trim();
    const pm   = document.querySelector("input[name='payment']:checked")?.value || "QRIS";
    if (!name)            { showToast("Nama harus diisi", "error"); return; }
    if (!wa||wa.length<8) { showToast("Nomor WhatsApp tidak valid", "error"); return; }
    await submitOrder(name, wa, pm);
  };
}

// ============================================================
// EXPOSE GLOBALS
// ============================================================
window.addToCart      = addToCart;
window.removeFromCart = removeFromCart;
window.deleteFromCart = deleteFromCart;
window.setItemNotes   = setItemNotes;
window.openCart       = openCart;
window.closeCart      = closeCart;
window.goToCheckout   = goToCheckout;
window.backToMenu     = backToMenu;
window.resetApp       = resetApp;
window.setCategory    = setCategory;

// ============================================================
// INIT
// ============================================================
document.addEventListener("DOMContentLoaded", () => {
  startMenuListener();
  renderApp();
});
</script>

<style>
  :root {
    --font-display: 'Playfair Display', serif;
    --font-mono: 'DM Mono', monospace;
    --font-body: 'DM Sans', sans-serif;
    --cream: #f7f2e8;
    --earth-50:  #faf7f0;
    --earth-100: #ede8db;
    --earth-200: #ddd4c2;
    --earth-300: #c8bba5;
    --earth-400: #9c8e78;
    --earth-500: #7a6e5c;
    --earth-700: #4a4035;
    --earth-800: #3a3028;
    --earth-900: #2a221c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--earth-800);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .font-display { font-family: var(--font-display); }
  .font-mono    { font-family: var(--font-mono); }
  .bg-cream     { background-color: var(--cream); }

  .card-warm {
    background: #fff;
    border: 1px solid var(--earth-100);
    box-shadow: 0 2px 16px rgba(80,60,40,0.07);
  }

  .input-field {
    width: 100%;
    border: 1.5px solid var(--earth-200);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 14px;
    font-family: var(--font-body);
    background: var(--earth-50);
    color: var(--earth-900);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-field:focus {
    border-color: #d97706;
    box-shadow: 0 0 0 3px rgba(217,119,6,0.12);
  }

  /* Sawah Senja primary — warm amber-brown */
  .btn-primary {
    background: linear-gradient(135deg, #92400e 0%, #b45309 50%, #d97706 100%);
    color: #fff;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 16px rgba(180,83,9,0.25);
  }
  .btn-primary:active { transform: scale(0.97); box-shadow: none; }

  .btn-sm-primary {
    background: #b45309;
    color: #fff;
    font-family: var(--font-body);
    cursor: pointer;
    border: none;
    transition: all 0.15s;
  }

  .tab-btn {
    font-family: var(--font-body);
    border: 1.5px solid var(--earth-100);
    background: #fff;
    color: var(--earth-500);
    cursor: pointer;
    transition: all 0.15s;
  }
  .tab-active {
    background: #92400e !important;
    color: #fff !important;
    border-color: #78350f !important;
  }

  .line-clamp-1 {
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .safe-bottom { padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  ::-webkit-scrollbar { height: 3px; width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--earth-200); border-radius: 2px; }
</style>
</head>
<body>
  <div id="app-root"></div>
</body>
</html>
